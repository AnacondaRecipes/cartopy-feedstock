{% set name = "cartopy" %}
{% set version = "0.25.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55f1a390e5f3f075b221c7d91fb10258ad978db786c7930eba06eb45d28753fe

build:
  number: 0
  skip: true  # [py<310]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - wheel
    - setuptools >=77.0.3
    - setuptools_scm >=8.0.0
    - cython >=0.29.24
    - numpy {{ numpy }}
  run:
    - python
    - numpy >=1.23
    - matplotlib-base >=3.6
    - shapely >=2.0
    - packaging >=21
    - pyshp >=2.3
    - pyproj >=3.3.1
  run_constrained:
    # ows
    - owslib >=0.27.0
    - pillow >=9.1
    # plotting
    - scipy >=1.9

test:
  imports:
    - cartopy
  commands:
    - pip check
    - pytest -ra -n 4 --pyargs cartopy
  requires:
    - pip
    - pytest >=5.1.2
    - pytest-xdist
    - scipy >=1.3.1

about:
  home: https://scitools.org.uk/cartopy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A library providing cartographic tools for python
  description: |
    Cartopy is a Python package designed for geospatial data processing in order to produce maps and other geospatial data analyses.

    Cartopy makes use of the powerful PROJ, NumPy and Shapely libraries and includes a programmatic interface built on top of Matplotlib for the creation of publication quality maps.
  dev_url: https://github.com/SciTools/cartopy
  doc_url: https://scitools.org.uk/cartopy/docs/latest

extra:
  recipe-maintainers:
    - marqh
    - ocefpaf
    - pelson
    - dopplershift
    - xylar
