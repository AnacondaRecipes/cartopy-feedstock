{% set name = "cartopy" %}
{% set version = "0.25.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 55f1a390e5f3f075b221c7d91fb10258ad978db786c7930eba06eb45d28753fe

build:
  # s390x: this package is not in the SoW
  skip: true  # [(win and vc<14) or s390x or py<310]
  number: 0
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{version}}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools >=77.0.3
    - setuptools_scm
    - wheel
    - cython >=0.29.24
    - numpy >=2.0.0
    - numpy 2.1  # [py==313]
    - setuptools-scm >=8.0.0
  run:
    - python
    - numpy >=1.23
    - shapely >=2.0
    - packaging >=21
    - pyshp >=2.3
    - matplotlib-base >=3.6
    - pyproj >=3.3.1
    - {{ pin_compatible('numpy') }}
  run_constrained:
    - scipy >=1.9
    - pillow >=9.1
    - OWSLib >=0.27.0

test:
  requires:
    - pip
    - pytest >=5.1.2
    - pytest-xdist
    - scipy >=1.3.1
  commands:
    - python -c "import cartopy.crs as ccrs; import matplotlib.pyplot as plt; ax = plt.axes(projection=ccrs.PlateCarree())"
    - pip check
    - pytest -ra -n 4 --pyargs cartopy

about:
  home: https://scitools.org.uk/cartopy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A library providing cartographic tools for python
  description: |
    Cartopy is a Python package designed for geospatial data processing in order to produce maps and other geospatial data analyses.

    Cartopy makes use of the powerful PROJ, NumPy and Shapely libraries and includes a programmatic interface built on top of Matplotlib for the creation of publication quality maps.
  dev_url: https://github.com/SciTools/cartopy
  doc_url: https://scitools.org.uk/cartopy/docs/latest/

extra:
  recipe-maintainers:
    - marqh
    - ocefpaf
    - pelson
    - dopplershift
    - xylar
