{% set name = "cartopy" %}
{% set version = "0.26.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: b87a35835f30333760cc46194bd90b6a4958d12f488f50131d4c4c0962ad9c3c

build:
  number: 0
  skip: true  # [py<311]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - wheel
    - setuptools >=77.0.3
    - setuptools_scm >=8.0.0
    - cython >=3.0.0
    - numpy {{ numpy }}
  run:
    - python
    - numpy >=1.26
    - matplotlib >=3.8
    - shapely >=2.0
    - packaging >=21
    - pyshp >=2.3.1
    - pyproj >=3.6
  run_constrained:
    # ows
    - owslib >=0.29.0
    - pillow >=9.1
    # plotting
    - scipy >=1.11

test:
  imports:
    - cartopy
    - cartopy.crs
    - cartopy.feature
    - cartopy.img_transform
    - cartopy.io
    - cartopy.mpl
    - cartopy.trace
    - cartopy.util
    - cartopy.vector_transform
  commands:
    - pip check
    - pytest -ra -n 4 --pyargs cartopy
  requires:
    - pip
    - pytest >=5.1.2
    - pytest-xdist
    - scipy >=1.11

about:
  home: https://scitools.org.uk/cartopy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A library providing cartographic tools for python
  description: |
    Cartopy is a Python package designed for geospatial data processing in order to produce maps and other geospatial data analyses.

    Cartopy makes use of the powerful PROJ, NumPy and Shapely libraries and includes a programmatic interface built on top of Matplotlib for the creation of publication quality maps.
  dev_url: https://github.com/SciTools/cartopy
  doc_url: https://scitools.org.uk/cartopy/docs/latest

extra:
  recipe-maintainers:
    - marqh
    - ocefpaf
    - pelson
    - dopplershift
    - xylar
